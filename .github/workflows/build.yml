name: 'Build'

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# every package version gets '+<run_number>' appended, so a manual run always
# outranks the previous one in APT without editing any version by hand
env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  chrome-apps:
    name: Build Chrome app launchers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y jq dpkg-dev

      - name: Build packages
        run: bash scripts/build-chrome.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chrome-debs
          path: dist/*.deb

  electron:
    name: Build Electron wrapper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: |
          BASE=$(node -p "require('./package.json').version")
          npm run dist -- --config.extraMetadata.version="${BASE}+${BUILD_NUMBER}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-debs
          path: electron/dist/*.deb

  release:
    name: Create GitHub release
    needs: [chrome-apps, electron]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: cd artifacts && sha256sum *.deb > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # a manual run has no tag, so the run number names the release
          tag_name: >-
            ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name ||
            format('build-{0}', github.run_number) }}
          files: |
            artifacts/*.deb
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apt-repo:
    name: Build APT repository
    needs: [chrome-apps, electron]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./debs
          merge-multiple: true

      - name: Install APT tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build APT repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: bash scripts/update-apt-repo.sh ./debs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [apt-repo]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
